<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="c"><circle cx="512" cy="512" r="512"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3d1e"/><stop offset="1" stop-color="#00c853"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="512" height="1024"/></clipPath>
    <clipPath id="right"><rect x="512" y="0" width="512" height="1024"/></clipPath>
  </defs>
  <!-- background: green left, black right (GreenBlack) -->
  <rect width="1024" height="1024" fill="#0a0a0a"/>
  <rect width="512" height="1024" fill="url(#g)"/>
  <!-- subtle grid lines (The Grid) -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <path d="M0 256H1024M0 512H1024M0 768H1024M256 0V1024M512 0V1024M768 0V1024"/>
  </g>
  <!-- the hat: black half on green, white half on black -->
  <g transform="translate(512 470)">
    <g clip-path="url(#left)" transform="translate(-512 -470)">
      <g transform="translate(512 470)" fill="#0a0a0a">
        <ellipse cx="0" cy="70" rx="330" ry="62"/>
        <path d="M-205 70 C-215 -40 -190 -150 -120 -190 C-60 -222 -20 -175 0 -175 C20 -175 60 -222 120 -190 C190 -150 215 -40 205 70 Z"/>
        <rect x="-205" y="10" width="410" height="48" fill="#00c853"/>
      </g>
    </g>
    <g clip-path="url(#right)" transform="translate(-512 -470)">
      <g transform="translate(512 470)" fill="#f2f2f2">
        <ellipse cx="0" cy="70" rx="330" ry="62"/>
        <path d="M-205 70 C-215 -40 -190 -150 -120 -190 C-60 -222 -20 -175 0 -175 C20 -175 60 -222 120 -190 C190 -150 215 -40 205 70 Z"/>
        <rect x="-205" y="10" width="410" height="48" fill="#0a0a0a"/>
      </g>
    </g>
  </g>
  <!-- name, centered so it survives the circle crop -->
  <text x="500" y="745" text-anchor="end" font-family="DejaVu Sans Mono" font-weight="bold" font-size="130" fill="#f2f2f2">KHE</text><text x="524" y="745" text-anchor="start" font-family="DejaVu Sans Mono" font-weight="bold" font-size="130" fill="#00e676">DR</text><!--
    
  -->
  <text x="512" y="815" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="40" fill="#9e9e9e" letter-spacing="10">GREENBLACK</text>
</svg>
